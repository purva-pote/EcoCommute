<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin users · EcoCommute</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body data-page="admin-users">
  <div id="adminNav"></div>

  <main class="container pb-4">
    <div class="page-header">
      <h1><i class="bi bi-people me-2"></i>Users</h1>
      <p class="text-muted mb-0">Search accounts, change roles and remove users.</p>
    </div>

    <div class="eco-card p-3 mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-md-8">
          <label class="form-label small text-muted mb-1" for="fSearch">Search by name or email</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" id="fSearch" placeholder="e.g. aarav" maxlength="100">
          </div>
        </div>
        <div class="col-md-4">
          <button class="btn btn-light w-100" id="fReset"><i class="bi bi-x-circle me-1"></i>Reset</button>
        </div>
      </div>
    </div>

    <div class="eco-card overflow-hidden">
      <div class="table-responsive">
        <table class="table eco-table">
          <thead>
            <tr><th>User</th><th>Role</th><th>Trips</th><th>CO₂ saved</th><th>Joined</th><th></th></tr>
          </thead>
          <tbody id="userBody">
            <tr><td colspan="6"><div class="skeleton" style="height:200px"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="admin-pager" id="pager"></div>
    </div>
  </main>

  <!-- Delete confirmation -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content p-4 text-center">
        <div class="fs-1 mb-2">🗑️</div>
        <h5 class="fw-bold">Delete this user?</h5>
        <p class="text-muted small mb-3" id="deleteText"></p>
        <div class="d-flex gap-2">
          <button class="btn btn-light flex-fill" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger flex-fill" id="confirmDelete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/co2.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/pages/admin-users.js"></script>
</body>
</html>
