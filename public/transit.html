<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transit Times · EcoCommute</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="transit">
  <div id="navbar"></div>

  <main class="container pb-4">
    <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <h1><i class="bi bi-train-front me-2"></i>Transit times</h1>
        <p class="text-muted mb-0">Local trains, metro and buses. Find your next ride, then log it in one tap.</p>
      </div>
      <ul class="nav transit-tabs" id="modeTabs" role="tablist"></ul>
    </div>

    <div class="row g-4">
      <!-- Planner -->
      <div class="col-lg-4">
        <div class="eco-card p-4 fade-in">
          <h5 class="card-title mb-3">Where are you headed?</h5>

          <label class="form-label fw-bold small text-muted" for="routeSelect">Line</label>
          <select class="form-select mb-3" id="routeSelect"></select>

          <div class="d-flex align-items-end gap-2 mb-3">
            <div class="flex-fill">
              <label class="form-label fw-bold small text-muted" for="fromSelect">From</label>
              <select class="form-select" id="fromSelect"></select>
            </div>
            <button class="btn btn-outline-primary swap-btn" id="swapBtn" type="button" title="Swap from and to" aria-label="Swap from and to">
              <i class="bi bi-arrow-down-up"></i>
            </button>
          </div>
          <label class="form-label fw-bold small text-muted" for="toSelect">To</label>
          <select class="form-select mb-3" id="toSelect"></select>

          <label class="form-label fw-bold small text-muted" for="timeInput">Leaving at</label>
          <div class="input-group mb-2">
            <input type="time" class="form-control" id="timeInput">
            <button class="btn btn-outline-primary" id="nowBtn" type="button" style="border-radius:0 14px 14px 0">Now</button>
          </div>
          <div class="small text-muted" id="liveHint"><i class="bi bi-broadcast me-1"></i>Live: updates every minute</div>
        </div>

        <!-- Route map -->
        <div class="eco-card p-4 mt-4">
          <h6 class="fw-bold mb-3"><i class="bi bi-signpost-split me-1"></i>Stops on your trip</h6>
          <ul class="stop-list" id="stopList"></ul>
        </div>
      </div>

      <!-- Results -->
      <div class="col-lg-8">
        <div class="eco-card overflow-hidden mb-4">
          <div class="p-4 pb-3">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
              <div>
                <div id="routeBadge" class="mb-2"></div>
                <h4 class="mb-1" id="tripTitle">Pick a trip</h4>
                <div class="text-muted small" id="tripMeta"></div>
              </div>
              <div class="text-end">
                <div class="p-2 px-3 rounded-4 bg-eco-mint d-inline-block mb-2">
                  <span class="fw-bold text-success" id="tripCo2">-</span>
                  <span class="small text-muted">CO₂ saved vs. driving</span>
                  <span class="badge text-bg-warning ms-1" id="tripPts"></span>
                </div><br>
                <a class="btn btn-primary btn-sm" id="logTripBtn" href="log-trip.html"><i class="bi bi-plus-circle me-1"></i>Log this trip</a>
              </div>
            </div>
          </div>
          <div class="border-top" id="depList">
            <div class="p-4"><div class="skeleton" style="height:260px"></div></div>
          </div>
          <div class="p-3 border-top small text-muted d-flex flex-wrap gap-3" id="serviceInfo"></div>
        </div>

      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/co2.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/transit.js"></script>
</body>
</html>
